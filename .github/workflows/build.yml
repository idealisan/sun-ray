name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release for this tag (set by the weekly geo build)'
        required: false
        type: string

# A new push to the same branch makes the run it superseded pointless; a
# release tag does not, so its run is never cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply embedded-assets patch to xray-core
        run: git -C xray-core apply --whitespace=nowarn ../patches/xray-core-embedded-assets.patch

      - name: Check the release tag against the manifest
        # The manifest names the macOS disk image, so a tag that disagrees
        # with it ships a release under the wrong name. Weekly geo builds
        # add -<short hash>-<date>; the leading version must still match.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG="${RELEASE_TAG:-${GITHUB_REF#refs/tags/v}}"
          TAG="${TAG#v}"
          MANIFEST=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' mygo.json)
          BASE="${TAG%%-*}"
          if [ "$TAG" != "$MANIFEST" ] && [ "$BASE" != "$MANIFEST" ]; then
            echo "::error::tag $TAG does not match the manifest version $MANIFEST"
            exit 1
          fi
          echo "tag $TAG matches the manifest version"

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          go test -v -timeout 300s ./... 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            tail -60 test-output.log | sed 's/^/::error::/'
            echo '### Test output (tail)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 test-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: test-output.log

      # Branch and pull request runs check that every platform compiles;
      # the packages and the release itself are only made for a tag, so the
      # two pushes of a release do not do the same work twice.
      - name: Compile
        if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
        run: |
          go build ./...
          go build -tags nogui ./...

      - name: Build
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # mygo build makes a signed .app (and a .dmg) with the icon and
            # Info.plist, so users can double-click it.
            go run github.com/egoist/mygo/cmd/mygo build -platform darwin/arm64 -o dist
            ditto -c -k --keepParent "dist/darwin-arm64/Sun Ray.app" "sun-ray-darwin-arm64.zip"
            # the disk image goes next to it, in the working directory
            for dmg in dist/darwin-arm64/*.dmg; do
              [ -e "$dmg" ] && cp "$dmg" .
            done
          else
            NAME=sun-ray-${{ matrix.name }}
            LDFLAGS="-s -w"
            if [ "$RUNNER_OS" = "Windows" ]; then
              NAME="$NAME.exe"
              # Go links a console-subsystem binary by default, so a
              # double-click opens a console. The GUI build must be a
              # windowsgui binary; the -tun-helper mode inherits that.
              LDFLAGS="-s -w -H windowsgui"
            fi
            go build -trimpath -ldflags "$LDFLAGS" -gcflags "all=-l" -tags mygo_noinspector -o "$NAME" .
          ls -l "$NAME"
          fi

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: sun-ray-${{ matrix.name }}
          path: |
            sun-ray-*
          if-no-files-found: error

  # End-to-end protocol tests: a local xray-core server per protocol, the
  # headless Sun Ray binary as the client, and curl through the mixed inbound.
  # A tag is cut from a master commit that just ran this; running it again
  # on the identical commit would only delay the release.
  integration:
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply embedded-assets patch to xray-core
        run: git -C xray-core apply --whitespace=nowarn ../patches/xray-core-embedded-assets.patch

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Integration tests
        timeout-minutes: 15
        run: go test -tags integration -count=1 -v -timeout 10m ./integration

  # The headless build for servers and containers: same core, same config
  # file, no user interface. Linux only, where nobody logs in anyway.
  nogui:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply embedded-assets patch to xray-core
        run: git -C xray-core apply --whitespace=nowarn ../patches/xray-core-embedded-assets.patch

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Build the headless binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in amd64 arm64 armv7; do
            goarch=$target
            goarm=
            case $target in
              armv7) goarch=arm; goarm=7 ;;
            esac
            CGO_ENABLED=0 GOOS=linux GOARCH=$goarch GOARM=$goarm go build -trimpath -ldflags "-s -w" -tags nogui -o "dist/sun-ray-nogui-linux-$target" .
          done
          ls -l dist

      - name: Check the headless binary
        run: |
          ./dist/sun-ray-nogui-linux-amd64 -version
          file dist/sun-ray-nogui-linux-armv7 | grep -q "ELF 32-bit.*ARM"
          cat > /tmp/sunray-test.json <<'JSON'
          {"global":{"listenPort":"39470","logLevel":"info"},"servers":[{"id":"t","name":"test","protocol":"freedom","network":"tcp","security":"none"}],"activeId":"t"}
          JSON
          timeout 5 ./dist/sun-ray-nogui-linux-amd64 -config /tmp/sunray-test.json || true

      - name: Upload the headless binaries
        uses: actions/upload-artifact@v4
        with:
          name: sun-ray-nogui
          path: dist/sun-ray-nogui-*
          if-no-files-found: error

  # The size each part contributes: the UI framework, the core, or both.
  size-report:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Apply embedded-assets patch to xray-core
        run: git -C xray-core apply --whitespace=nowarn ../patches/xray-core-embedded-assets.patch

      - name: Build the app and the probes
        run: bash scripts/size-report.sh

      - name: Upload the probes
        uses: actions/upload-artifact@v4
        with:
          name: probes
          path: dist/probe-*
          if-no-files-found: error

  # On a v* tag push, or when the weekly geo build supplies a tag, create
  # a GitHub Release and attach all binaries.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, nogui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sun-ray-*
          merge-multiple: true
          path: dist

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/**
          generate_release_notes: true