name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply embedded-assets patch to xray-core
        run: git -C xray-core apply --whitespace=nowarn ../patches/xray-core-embedded-assets.patch

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          go test -v -timeout 300s ./... 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            tail -60 test-output.log | sed 's/^/::error::/'
            echo '### Test output (tail)' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 test-output.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $code

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: test-output.log

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            # mygo build makes a signed .app (and a .dmg) with the icon and
            # Info.plist, so users can double-click it.
            go run github.com/egoist/mygo/cmd/mygo build -platform darwin/arm64 -o dist
            ditto -c -k --keepParent "dist/darwin-arm64/Sun Ray.app" "dist/sun-ray-darwin-arm64.zip"
          else
            NAME=sun-ray-${{ matrix.name }}
            if [ "$RUNNER_OS" = "Windows" ]; then NAME="$NAME.exe"; fi
            go build -trimpath -ldflags "-s -w" -gcflags "all=-l" -tags mygo_noinspector -o "$NAME" .
          ls -l "$NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-ray-${{ matrix.name }}
          path: |
            sun-ray-*
            dist/sun-ray-darwin-arm64.zip
            dist/darwin-arm64/*.dmg
          if-no-files-found: error

  # The size each part contributes: the UI framework, the core, or both.
  size-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Apply embedded-assets patch to xray-core
        run: git -C xray-core apply --whitespace=nowarn ../patches/xray-core-embedded-assets.patch

      - name: Apply the WARP patch to mygo
        run: git -C mygo apply --whitespace=nowarn ../patches/mygo-force-warp.patch

      - name: Build the app and the probes
        run: bash scripts/size-report.sh

      - name: Upload the probes
        uses: actions/upload-artifact@v4
        with:
          name: probes
          path: dist/probe-*
          if-no-files-found: error

  # On a v* tag push, create a GitHub Release and attach all binaries.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true