name: build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          - os: windows-latest
            name: windows-amd64
          - os: macos-latest
            name: darwin-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test
        if: runner.os == 'Linux'
        run: |
          go test -v ./... 2>&1 | tee test-output.log
          exit ${PIPESTATUS[0]}

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.name }}
          path: test-output.log

      - name: Build
        run: |
          NAME=sun-ray-${{ matrix.name }}
          if [ "$RUNNER_OS" = "Windows" ]; then NAME="$NAME.exe"; fi
          go build -trimpath -ldflags "-s -w" -o "$NAME" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-ray-${{ matrix.name }}
          path: sun-ray-*
          if-no-files-found: error

  # On a v* tag push, create a GitHub Release and attach all binaries.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true