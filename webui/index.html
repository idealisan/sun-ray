<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sun Ray</title>
<style>
  :root{
    --bg:#f5f6f8; --panel:#fff; --line:#e3e6ea; --text:#1f2329; --muted:#8a9099;
    --accent:#2f6feb; --accent-weak:#eaf1ff; --danger:#d64545; --danger-weak:#fdecec;
    --ok:#1a9d5a; --shadow:0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
         border-radius:10px;padding:12px 16px;box-shadow:var(--shadow);flex-wrap:wrap}
  header h1{font-size:18px;margin:0 6px 0 0}
  #cur{color:var(--muted);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #speed{color:var(--muted);font-variant-numeric:tabular-nums}
  .badge{font-weight:600;padding:2px 10px;border-radius:20px;font-size:13px}
  .badge.on{color:var(--ok);background:#e7f7ef}
  .badge.off{color:var(--muted);background:#eef0f2}
  .badge.warn{color:var(--danger);background:var(--danger-weak)}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);
         border-radius:7px;padding:6px 12px;transition:.12s}
  button:hover{border-color:#c7ccd3;background:#fafbfc}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#285fd0}
  button.danger{color:var(--danger)}
  button.danger:hover{background:var(--danger-weak);border-color:#eab4b4}
  button.sm{padding:3px 9px;font-size:13px}
  nav.tabs{display:flex;gap:2px;margin:14px 0 0;border-bottom:2px solid var(--line)}
  nav.tabs button{border:none;background:none;border-radius:0;padding:9px 20px;color:var(--muted);
                  border-bottom:2px solid transparent;margin-bottom:-2px;font-size:15px}
  nav.tabs button:hover{background:none;color:var(--text)}
  nav.tabs button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;
       padding:18px;min-height:420px}
  section[hidden]{display:none}
  h2{font-size:15px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .group{margin-bottom:18px}
  .group h3{font-size:13px;color:var(--muted);margin:0 0 8px;font-weight:600;text-transform:none}
  .field{display:flex;align-items:center;gap:10px;margin:7px 0;min-height:30px}
  .field label{width:170px;flex:none;color:#4a5058}
  .field .hint{color:var(--muted);font-size:12px}
  input[type=text],input[type=number],input[type=password],select,textarea{
    font:inherit;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;
    color:var(--text);max-width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-weak);border-color:var(--accent)}
  .field input[type=text],.field select{flex:1}
  .field label.chk{width:auto;display:flex;align-items:center;gap:6px;color:var(--text)}
  .tag{font-size:11px;color:var(--muted);background:#eef0f2;border-radius:4px;padding:1px 6px;margin-left:6px}
  .toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .toolbar .spacer{flex:1}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{color:var(--muted);font-weight:600;background:#fafbfc}
  tr.sel td{background:var(--accent-weak)}
  td.nowrap{white-space:nowrap}
  .muted{color:var(--muted)}
  .rowbtns{display:flex;gap:5px;flex-wrap:wrap}
  .editor{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;background:#fafbfc}
  .editor .cols{gap:16px}
  .editor h3{margin:0 0 8px}
  .editor .actions{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 20px}
  pre.log{background:#14181d;color:#d6dae0;border-radius:8px;padding:12px;height:360px;overflow:auto;
          font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  #banner{background:var(--danger-weak);border:1px solid #f0c2c2;color:#a33;border-radius:8px;
          padding:10px 14px;margin:12px 0;display:flex;align-items:center;gap:12px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;
         padding:9px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:80%}
  #toast.show{opacity:.95}
  .err{color:var(--danger);font-size:13px;margin:6px 0}
  .pill{font-size:12px;padding:1px 8px;border-radius:12px;background:#eef0f2;color:#555}
  .pill.direct{background:#e7f7ef;color:#1a7d4b}
  .pill.proxy{background:var(--accent-weak);color:var(--accent)}
  .pill.block{background:var(--danger-weak);color:var(--danger)}
  .menu{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:8px;
        box-shadow:0 6px 22px rgba(0,0,0,.15);padding:4px;min-width:150px}
  .menu button{display:block;width:100%;text-align:left;border:none;background:none;border-radius:5px;padding:7px 10px}
  .menu button:hover{background:var(--accent-weak)}
  .menu hr{border:none;border-top:1px solid var(--line);margin:4px 0}
  .small-note{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sun Ray</h1>
    <span id="cur">当前：—</span>
    <span id="speed">↑ 0 B/s  ↓ 0 B/s</span>
    <span id="status" class="badge off">已停止</span>
    <button id="toggle" class="primary">启动</button>
  </header>

  <div id="banner" hidden>
    <span id="banner-text"></span>
    <span class="spacer" style="flex:1"></span>
    <button class="danger sm" id="reset">创建全新配置</button>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="global" class="active">全局</button>
    <button data-tab="servers">服务器</button>
    <button data-tab="subs">订阅</button>
    <button data-tab="policy">策略</button>
    <button data-tab="log">日志</button>
  </nav>

  <main>
    <!-- 全局 -->
    <section id="tab-global">
      <div class="cols">
        <div>
          <div class="group">
            <h3>入站（本机代理）</h3>
            <div class="field"><label>监听端口（SOCKS 与 HTTP 共用）</label><input type="text" data-g="listenPort" placeholder="10808"></div>
            <div class="field"><label>允许局域网连接</label><label class="chk"><input type="checkbox" data-g="allowLAN"> 监听 0.0.0.0</label></div>
            <div class="field"><label>启动后自动运行代理</label><label class="chk"><input type="checkbox" data-g="autoStart"></label></div>
            <div class="field"><label>设置代理环境变量</label><label class="chk"><input type="checkbox" data-g="envProxy"></label><span class="tag">仅 GUI 生效</span></div>
            <div class="field"><label>软件渲染</label><label class="chk"><input type="checkbox" data-g="softRender"></label><span class="tag">仅 GUI 生效</span></div>
          </div>
          <div class="group">
            <h3>日志</h3>
            <div class="field"><label>日志级别</label><select data-g="logLevel" id="g-logLevel"></select></div>
          </div>
          <div class="group">
            <h3>TUN 模式 <span class="tag">仅 GUI 接管</span></h3>
            <div class="field"><label>启用 TUN（接管全部流量）</label><label class="chk"><input type="checkbox" data-g="tunEnabled"></label></div>
            <div class="field"><label>接口名</label><input type="text" data-g="tunName" placeholder="留空自动选择"></div>
            <div class="field"><label>MTU（默认 1500）</label><input type="number" data-g="tunMtu"></div>
            <div class="field"><label>网关地址</label><input type="text" data-g="tunGateway"></div>
            <div class="small-note">webui 版不启动 TUN 辅助进程、不改系统代理；TUN 配置会写入 sunray.json，供 GUI 版使用。</div>
          </div>
        </div>
        <div>
          <div class="group">
            <h3>系统代理 <span class="tag">仅 GUI 生效</span></h3>
            <div class="field"><label>代理模式</label><select data-g="proxyMode" id="g-proxyMode"></select></div>
          </div>
          <div class="group">
            <h3>路由预设</h3>
            <div class="field"><label>绕过大陆（CN 直连）</label><label class="chk"><input type="checkbox" data-g="routeCN"></label></div>
            <div class="field"><label>屏蔽广告</label><label class="chk"><input type="checkbox" data-g="routeAds"></label></div>
          </div>
          <div class="group">
            <h3>域名解析策略</h3>
            <div class="field"><label>解析列表外的域名，并根据 IP 进一步路由</label><label class="chk"><input type="checkbox" data-g="resolveOther"></label></div>
            <div class="field"><label>DNS 服务器</label><select data-g="dnsPreset" id="g-dnsPreset"></select></div>
            <div class="field"><label>自定义 DNS</label><input type="text" data-g="dnsCustom" placeholder="223.5.5.5, https://dns.alidns.com/dns-query"></div>
            <div class="small-note">这里的 DNS 只为分流判定服务；翻墙流量的域名始终由远端服务器解析。</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 服务器 -->
    <section id="tab-servers" hidden>
      <h2>服务器</h2>
      <div class="toolbar">
        <button class="primary sm" id="srv-add">新增</button>
        <button class="sm" id="srv-import">导入分享链接</button>
        <button class="sm" id="srv-export">导出分享链接</button>
        <span class="spacer"></span>
        <span class="muted" id="srv-count"></span>
      </div>
      <div id="srv-editor"></div>
      <table>
        <thead><tr><th>当前</th><th>名称</th><th>协议</th><th>地址</th><th>端口</th><th>延迟</th><th>速度</th><th style="width:230px">操作</th></tr></thead>
        <tbody id="srv-rows"></tbody>
      </table>
      <div id="srv-import-box"></div>
    </section>

    <!-- 订阅 -->
    <section id="tab-subs" hidden>
      <h2>订阅</h2>
      <div class="toolbar">
        <button class="primary sm" id="sub-add">新增</button>
        <button class="sm" id="sub-update">更新全部</button>
        <span class="spacer"></span>
        <span class="muted" id="sub-count"></span>
      </div>
      <div id="sub-editor"></div>
      <table>
        <thead><tr><th>名称</th><th>订阅地址</th><th>节点</th><th>更新时间</th><th>状态</th><th style="width:220px">操作</th></tr></thead>
        <tbody id="sub-rows"></tbody>
      </table>
    </section>

    <!-- 策略 -->
    <section id="tab-policy" hidden>
      <h2>策略</h2>
      <div class="toolbar">
        <button class="primary sm" id="pol-add">新增</button>
        <button class="sm" id="pol-test">测试</button>
        <span class="spacer"></span>
        <span class="muted">从上到下，第一条匹配生效</span>
      </div>
      <div id="pol-editor"></div>
      <div id="pol-test-box"></div>
      <table>
        <thead><tr><th style="width:50px">#</th><th>类型</th><th>匹配内容</th><th>动作</th><th style="width:200px">操作</th></tr></thead>
        <tbody id="pol-rows"></tbody>
      </table>
    </section>

    <!-- 日志 -->
    <section id="tab-log" hidden>
      <h2>日志</h2>
      <div class="toolbar">
        <button class="sm" id="log-clear">清空日志</button>
        <span class="spacer"></span>
        <span class="muted" id="log-version"></span>
      </div>
      <pre class="log" id="log-text"></pre>
    </section>
  </main>
</div>

<div id="toast"></div>

<script>
"use strict";
// The GUI (main.go view + tabs) is authoritative for this layout. This page
// is a separate, framework-free client over the JSON API in
// webui_controller.go. No build step, no external requests.

const TABS = ["global","servers","subs","policy","log"];
let state = null;      // latest /api/state
let meta = null;       // /api/meta (built once)
let tab = "global";
let editor = null;     // {kind, ...draft} — an open inline editor; pauses table redraw
let prev = {up:0, down:0, t:0};

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

async function api(path, method="GET", body){
  const opt = {method};
  if (body !== undefined){ opt.headers={"Content-Type":"application/json"}; opt.body=JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (!r.ok){ throw new Error("HTTP "+r.status); }
  return r.json();
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"), 2200);
}
function fmtBytes(n){
  if (!n || n<0) n=0;
  const u=["B","KB","MB","GB","TB"]; let i=0, v=n;
  while (v>=1024 && i<u.length-1){ v/=1024; i++; }
  return (i===0? v.toFixed(0) : v.toFixed(1))+" "+u[i];
}
function displayName(s){
  if (!s) return "—";
  if (s.name) return s.name;
  if (s.address) return s.protocol+" · "+s.address;
  return "未命名 "+s.protocol;
}
function fmtTime(ts){
  if (!ts) return "—";
  const d=new Date(ts*1000), p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function deep(o){ return JSON.parse(JSON.stringify(o)); }

// Build an appConfig snapshot from the latest state, pass it through a
// mutator, and save it; then refresh immediately.
async function saveConfig(mutator){
  if (!state) return;
  const cfg = deep(state.config);
  mutator(cfg);
  const res = await api("/api/config","POST",cfg);
  if (res.error) toast("保存失败："+res.error);
  await refresh();
  return res;
}

async function refresh(){
  try { state = await api("/api/state"); } catch(e){ return; }
  renderHeader();
  renderBanner();
  if (editor === null) renderTab();       // don't clobber an open editor
  else renderNonEditing();
  renderLog();                            // log tab always up to date
}

function renderHeader(){
  const g = state.config.global || {};
  const cur = state.config.servers.find(s=>s.id===state.activeId) || null;
  $("#cur").textContent = "当前：" + (cur? displayName(cur) : "未选择服务器");
  const now = Date.now();
  const dt = (now - prev.t)/1000;
  if (prev.t && dt>0){
    const up = Math.max(0,(state.up-prev.up)/dt), down = Math.max(0,(state.down-prev.down)/dt);
    $("#speed").textContent = "↑ "+fmtBytes(up)+"/s  ↓ "+fmtBytes(down)+"/s";
  }
  prev = {up:state.up, down:state.down, t:now};
  const st=$("#status"), tg=$("#toggle");
  if (state.running){ st.textContent="运行中"; st.className="badge on"; tg.textContent="停止"; tg.classList.remove("primary"); }
  else { st.textContent="已停止"; st.className="badge off"; tg.textContent="启动"; tg.classList.add("primary"); }
  if (g.tunEnabled && !state.running){ /* no-op: TUN is GUI-only here */ }
  $("#log-version").textContent = state.version;
}

function renderBanner(){
  const b=$("#banner");
  if (state.configBroken){ b.hidden=false; $("#banner-text").textContent="配置加载失败，已阻止写回原文件："+state.configBroken; }
  else b.hidden=true;
}

function switchTab(name){
  tab=name;
  $$("#tabs button").forEach(b=>b.classList.toggle("active", b.dataset.tab===name));
  TABS.forEach(t=> $("#tab-"+t).hidden = (t!==name));
  editor=null;
  renderTab();
}
function renderTab(){
  if (tab==="global") renderGlobal();
  else if (tab==="servers") renderServers();
  else if (tab==="subs") renderSubs();
  else if (tab==="policy") renderPolicy();
  else if (tab==="log") renderLog();
}
function renderNonEditing(){ if (tab==="log") renderLog(); }

// ---------- 全局 ----------
function fillSelect(el, values, labels){
  el.innerHTML = values.map((v,i)=>`<option value="${esc(v)}">${esc(labels?labels[i]:v)}</option>`).join("");
}
let globalReady=false;
function initGlobal(){
  if (!meta || globalReady) return;
  fillSelect($("#g-logLevel"), meta.logLevels, meta.logLevels);
  fillSelect($("#g-proxyMode"), meta.proxyModeValues, meta.proxyModeLabels);
  fillSelect($("#g-dnsPreset"), meta.dnsPresetValues, meta.dnsPresetLabels);
  globalReady=true;
}
function renderGlobal(){
  initGlobal();
  const g=state.config.global||{};
  $$("[data-g]").forEach(el=>{
    const k=el.dataset.g;
    if (document.activeElement===el) return;      // don't fight the user typing
    if (el.type==="checkbox"){
      if (k==="resolveOther") el.checked = g.domainStrategy==="ipifnonmatch";
      else el.checked = !!g[k];
    } else if (k==="tunMtu") el.value = g.tunMtu||1500;
    else el.value = g[k]!=null? g[k] : "";
  });
}
async function globalChange(el){
  const k=el.dataset.g;
  await saveConfig(cfg=>{
    const g=cfg.global;
    if (k==="resolveOther") g.domainStrategy = el.checked? "ipifnonmatch":"asis";
    else if (k==="tunMtu") g.tunMtu = parseFloat(el.value)||1500;
    else if (el.type==="checkbox") g[k]=el.checked;
    else g[k]=el.value;
  });
}

// ---------- 服务器 ----------
function srvResult(id){ return (state.config.results||{})[id]||{}; }
function renderServers(){
  const rows=$("#srv-rows"); const cfg=state.config;
  $("#srv-count").textContent="共 "+cfg.servers.length+" 个节点";
  rows.innerHTML = cfg.servers.map((s,i)=>{
    const r=srvResult(s.id);
    return `<tr data-i="${i}" class="${s.id===state.activeId?"sel":""}">
      <td>${s.id===state.activeId?"●":""}</td>
      <td>${esc(displayName(s))}</td>
      <td>${esc(s.protocol)}</td>
      <td>${esc(s.address)}</td>
      <td>${esc(s.port)}</td>
      <td class="nowrap">${r.latencyMs!=null?esc(r.latencyMs)+" ms":"—"}</td>
      <td class="nowrap">${r.speedBps?esc(fmtBytes(r.speedBps))+"/s":"—"}</td>
      <td><div class="rowbtns">
        <button class="sm" data-act="active">设为当前</button>
        <button class="sm" data-act="edit">编辑</button>
        <button class="sm" data-act="copy">复制</button>
        <button class="sm" data-act="test">测速</button>
        <button class="sm danger" data-act="del">删除</button>
      </div></td></tr>`;
  }).join("") || `<tr><td colspan="8" class="muted">还没有服务器，点「新增」或「导入分享链接」。</td></tr>`;
  $("#srv-editor").innerHTML=""; $("#srv-import-box").innerHTML="";
}

// server editor: all fields, mirroring serverForm in the GUI, using the
// field metadata exported from the same protocolRegistry.
function serverField(f, s){
  const val = s[f.key]!=null? s[f.key] : "";
  if (f.kind==="check")
    return `<div class="field"><label class="chk"><input type="checkbox" data-sf="${esc(f.key)}" ${val?"checked":""}> ${esc(f.label)}</label></div>`;
  if (f.kind==="select")
    return `<div class="field"><label>${esc(f.label)}</label><select data-sf="${esc(f.key)}">${f.options.map(o=>`<option value="${esc(o)}" ${o===val?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  return `<div class="field"><label>${esc(f.label)}</label><input type="text" data-sf="${esc(f.key)}" value="${esc(val)}" placeholder="${esc(f.placeholder||"")}"></div>`;
}
function openServerEditor(i){
  const isNew = (i==null);
  const s = isNew? {id:"",name:"",protocol:"vless",address:"",port:"443",secret:"",network:"tcp",security:"none",fingerprint:"chrome",spiderX:"/",vmessSecurity:"auto",vmessAlterId:"0",method:"aes-256-gcm"}
                 : deep(state.config.servers[i]);
  editor={kind:"server",i,s};
  renderServerEditor();
}
function renderServerEditor(){
  const {s}=editor;
  const sp=(meta.protocolSpecs[s.protocol])||{};
  const base = meta.serverFields;
  const bf = k => base.find(f=>f.key===k);
  let h = `<div class="editor"><h3>${editor.i==null?"新增服务器":"编辑服务器"}</h3><div class="cols"><div>`;
  h += serverField(bf("name"),s);
  h += serverField(bf("protocol"),s);
  if (sp.needsAddr){ h+=serverField(bf("address"),s)+serverField(bf("port"),s); }
  if (sp.needsSecret){
    h+=`<div class="field"><label>${esc(sp.secretLabel||"密钥")}</label><input type="text" data-sf="secret" value="${esc(s.secret||"")}"></div>`;
  }
  (sp.fields||[]).forEach(f=>h+=serverField(f,s));
  h += `</div><div>`;
  if (sp.stream){
    h += `<div class="group"><h3>传输层</h3>`+serverField(bf("network"),s);
    const net=s.network;
    if (net==="ws"||net==="httpupgrade") h+=serverField(bf("path"),s)+serverField(bf("host"),s);
    else if (net==="grpc") h+=serverField(bf("service"),s)+serverField(bf("host"),s);
    h += `</div><div class="group"><h3>安全</h3>`+serverField(bf("security"),s);
    if (s.security==="tls") h+=serverField(bf("sni"),s)+serverField(bf("alpn"),s)+serverField(bf("fingerprint"),s)+serverField(bf("allowInsecure"),s);
    else if (s.security==="reality") h+=serverField(bf("sni"),s)+serverField(bf("publicKey"),s)+serverField(bf("shortID"),s)+serverField(bf("spiderX"),s)+serverField(bf("fingerprint"),s);
    h += `</div>`;
  } else if (sp.tlsOnly){
    h += `<div class="group"><h3>安全</h3>`+serverField(bf("security"),s)+serverField(bf("sni"),s)+serverField(bf("alpn"),s)+serverField(bf("allowInsecure"),s)+`</div>`;
  }
  h += `</div></div><div class="err" id="srv-err"></div><div class="actions">
    <button id="srv-cancel">取消</button><button class="primary" id="srv-save">保存</button></div></div>`;
  $("#srv-editor").innerHTML=h;
  $("#srv-editor [data-sf]").forEach(el=>{
    if (el.dataset.sf==="protocol"||el.dataset.sf==="network"||el.dataset.sf==="security")
      el.addEventListener("change",()=>{ collectServer(); renderServerEditor(); });
  });
  $("#srv-cancel").onclick=()=>{editor=null;renderServers();};
  $("#srv-save").onclick=saveServer;
}
function collectServer(){
  const s=editor.s;
  $$("#srv-editor [data-sf]").forEach(el=>{
    const k=el.dataset.sf;
    s[k] = el.type==="checkbox"? el.checked : el.value;
  });
}
async function saveServer(){
  collectServer();
  const s=editor.s, i=editor.i;
  if (!s.protocol){ $("#srv-err").textContent="请选择协议"; return; }
  const res=await saveConfig(cfg=>{
    if (i==null){ s.id=s.id||""; cfg.servers.push(s); }
    else cfg.servers[i]=s;
    if (!cfg.servers.some(x=>x.id===cfg.activeId) && cfg.servers.length) cfg.activeId=cfg.servers[0].id;
  });
  editor=null; renderServers();
}
function openImport(){
  editor={kind:"import"};
  $("#srv-import-box").innerHTML=`<div class="editor"><h3>导入分享链接（每行一个）</h3>
    <textarea id="imp-text" rows="5" style="width:100%" placeholder="vless://... \nvmess://... \nss://..."></textarea>
    <div class="err" id="imp-err"></div><div class="actions">
    <button id="imp-cancel">取消</button><button class="primary" id="imp-ok">导入</button></div></div>`;
  $("#imp-cancel").onclick=()=>{editor=null;renderServers();};
  $("#imp-ok").onclick=async()=>{
    const text=$("#imp-text").value;
    const res=await api("/api/servers/import","POST",{text});
    if (res.error){ $("#imp-err").textContent=res.error; return; }
    editor=null; await refresh(); toast("已导入 "+res.imported+" 个节点");
  };
}

// ---------- 订阅 ----------
function renderSubs(){
  const rows=$("#sub-rows"); const subs=state.config.subscriptions||[];
  $("#sub-count").textContent="共 "+subs.length+" 个订阅";
  rows.innerHTML=subs.map((s,i)=>`<tr data-i="${i}">
    <td>${esc(s.name||s.displayName||"未命名订阅")}</td>
    <td style="max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(s.url)}</td>
    <td>${s.serverCount!=null?esc(s.serverCount):"—"}</td>
    <td class="nowrap">${esc(fmtTime(s.updatedAt))}</td>
    <td>${s.lastError?`<span class="pill block">${esc(s.lastError)}</span>`:(s.updatedAt?'<span class="pill direct">正常</span>':'<span class="muted">未更新</span>')}</td>
    <td><div class="rowbtns">
      <button class="sm" data-sact="update">更新</button>
      <button class="sm" data-sact="edit">编辑</button>
      <button class="sm danger" data-sact="del">删除</button>
    </div></td></tr>`).join("") || `<tr><td colspan="6" class="muted">还没有订阅。</td></tr>`;
  $("#sub-editor").innerHTML="";
}
function openSubEditor(i){
  const isNew=(i==null);
  const s=isNew? {id:"",name:"",url:""} : deep(state.config.subscriptions[i]);
  editor={kind:"sub",i,s};
  $("#sub-editor").innerHTML=`<div class="editor"><h3>${isNew?"新增订阅":"编辑订阅"}</h3>
    <div class="grid2">
      <div class="field"><label>名称</label><input type="text" id="sub-name" value="${esc(s.name||"")}"></div>
      <div class="field"><label>订阅地址</label><input type="text" id="sub-url" value="${esc(s.url||"")}" placeholder="https://..."></div>
    </div><div class="err" id="sub-err"></div><div class="actions">
    <button id="sub-cancel">取消</button><button class="primary" id="sub-save">保存</button></div></div>`;
  $("#sub-cancel").onclick=()=>{editor=null;renderSubs();};
  $("#sub-save").onclick=async()=>{
    const s=editor.s,i=editor.i;
    s.name=$("#sub-name").value; s.url=$("#sub-url").value;
    if (!s.url.trim()){ $("#sub-err").textContent="请填写订阅地址"; return; }
    await saveConfig(cfg=>{ if(i==null) cfg.subscriptions.push(s); else cfg.subscriptions[i]=s; });
    editor=null; renderSubs();
  };
}

// ---------- 策略 ----------
function polLabel(vals,labels,v){ const i=vals.indexOf(v); return i>=0?labels[i]:v; }
function renderPolicy(){
  const rows=$("#pol-rows"); const ps=state.config.global.policies||[];
  const tv=meta.policyTypeValues, tl=meta.policyTypeLabels, av=meta.policyActionValues, al=meta.policyActionLabels;
  rows.innerHTML=ps.map((p,i)=>`<tr data-i="${i}">
    <td class="muted">${i+1}</td>
    <td>${esc(polLabel(tv,tl,p.type))}</td>
    <td>${esc(p.value)}</td>
    <td><span class="pill ${esc(p.action)}">${esc(polLabel(av,al,p.action))}</span></td>
    <td><div class="rowbtns">
      <button class="sm" data-pact="up" ${i===0?"disabled":""}>上移</button>
      <button class="sm" data-pact="down" ${i===ps.length-1?"disabled":""}>下移</button>
      <button class="sm" data-pact="edit">编辑</button>
      <button class="sm danger" data-pact="del">删除</button>
    </div></td></tr>`).join("") || `<tr><td colspan="5" class="muted">还没有策略。策略排在所有内置规则之前，可覆盖绕过大陆等预设。</td></tr>`;
  $("#pol-editor").innerHTML="";
}
function openPolicyEditor(i){
  const isNew=(i==null);
  const p=isNew? {type:meta.policyTypeValues[0],value:"",action:meta.policyActionValues[0]}
               : deep(state.config.global.policies[i]);
  editor={kind:"policy",i,p};
  const opts=(vals,labels,sel)=>vals.map((v,k)=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(labels[k])}</option>`).join("");
  $("#pol-editor").innerHTML=`<div class="editor"><h3>${isNew?"新增策略":"编辑策略"}</h3>
    <div class="grid2">
      <div class="field"><label>类型</label><select id="pol-type">${opts(meta.policyTypeValues,meta.policyTypeLabels,p.type)}</select></div>
      <div class="field"><label>动作</label><select id="pol-action">${opts(meta.policyActionValues,meta.policyActionLabels,p.action)}</select></div>
      <div class="field" style="grid-column:1/3"><label>匹配内容</label><input type="text" id="pol-value" value="${esc(p.value)}" placeholder="example.com 或 10.0.0.0/8"></div>
    </div><div class="err" id="pol-err"></div><div class="actions">
    <button id="pol-cancel">取消</button><button class="primary" id="pol-save">保存</button></div></div>`;
  $("#pol-cancel").onclick=()=>{editor=null;renderPolicy();};
  $("#pol-save").onclick=async()=>{
    const p=editor.p,i=editor.i;
    p.type=$("#pol-type").value; p.action=$("#pol-action").value; p.value=$("#pol-value").value.trim();
    if (!p.value){ $("#pol-err").textContent="请填写匹配内容"; return; }
    const dup=(state.config.global.policies||[]).some((x,k)=>k!==i && x.type===p.type && x.value.toLowerCase()===p.value.toLowerCase());
    if (dup){ $("#pol-err").textContent="已经有一条相同的规则"; return; }
    const res=await saveConfig(cfg=>{ if(!cfg.global.policies)cfg.global.policies=[]; if(i==null)cfg.global.policies.push(p); else cfg.global.policies[i]=p; });
    if (res && res.error){ $("#pol-err").textContent=res.error; return; }
    editor=null; renderPolicy();
  };
}
function openPolicyTest(){
  editor={kind:"poltest"};
  $("#pol-test-box").innerHTML=`<div class="editor"><h3>测试策略</h3>
    <div class="field"><label>域名或 IP</label><input type="text" id="pt-input" placeholder="www.google.com 或 10.1.2.3" style="flex:1"></div>
    <div class="actions"><button id="pt-run">测试</button><button id="pt-close">关闭</button></div>
    <div id="pt-result" class="small-note"></div></div>`;
  $("#pt-close").onclick=()=>{editor=null;renderPolicy();};
  $("#pt-run").onclick=async()=>{
    const res=await api("/api/policy/test","POST",{input:$("#pt-input").value});
    if (res.error){ $("#pt-result").textContent=res.error; return; }
    const labels={"direct":"直连","proxy":"代理","block":"拦截"};
    $("#pt-result").innerHTML=`<b>${esc(res.source)}</b> → ${esc(labels[res.action]||res.action)}`+(res.note?`<br>${esc(res.note)}`:"");
  };
}

// ---------- 日志 ----------
function renderLog(){
  const el=$("#log-text"); if(!el||!state) return;
  const text=(state.logs||[]).join("\n");
  if (el.textContent!==text){ el.textContent=text; el.scrollTop=el.scrollHeight; }
}

// ---------- 事件绑定 ----------
$("#tabs").addEventListener("click",e=>{ const b=e.target.closest("button[data-tab]"); if(b)switchTab(b.dataset.tab); });
$("#toggle").onclick=async()=>{
  const res=await api(state.running?"/api/stop":"/api/start","POST",{});
  if (res.error) toast(res.error); await refresh();
};
$("#reset").onclick=async()=>{ if(!confirm("将创建全新的默认配置并覆盖当前配置文件，确定？"))return; await api("/api/config/reset","POST",{}); await refresh(); };

$$("[data-g]").forEach(el=>{
  const ev = (el.tagName==="SELECT"||el.type==="checkbox")?"change":"change";
  el.addEventListener(ev,()=>globalChange(el));
});

$("#srv-add").onclick=()=>openServerEditor(null);
$("#srv-import").onclick=openImport;
$("#srv-export").onclick=async()=>{
  const res=await api("/api/servers/export");
  editor={kind:"export"};
  $("#srv-import-box").innerHTML=`<div class="editor"><h3>导出分享链接</h3>
    <textarea id="exp-text" rows="6" style="width:100%">${esc(res.text)}</textarea>
    ${res.errors&&res.errors.length?`<div class="err">${esc(res.errors.join("；"))}</div>`:""}
    <div class="actions"><button id="exp-close">关闭</button></div></div>`;
  $("#exp-close").onclick=()=>{editor=null;renderServers();};
};
$("#srv-rows").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-act]"); if(!b)return;
  const i=+b.closest("tr").dataset.i, s=state.config.servers[i], act=b.dataset.act;
  if(act==="active") await saveConfig(cfg=>cfg.activeId=s.id);
  else if(act==="edit") openServerEditor(i);
  else if(act==="copy") await saveConfig(cfg=>{const c=deep(s);c.id="";c.name=(c.name||"节点")+" 副本";cfg.servers.push(c);});
  else if(act==="del"){ if(confirm("删除 「"+displayName(s)+"」？")) await saveConfig(cfg=>cfg.servers.splice(i,1)); }
  else if(act==="test"){ toast("正在测速 "+displayName(s)+"…"); const r=await api("/api/test","POST",{id:s.id});
    if(r.error) toast("测速失败："+r.error); else toast("延迟 "+r.latency+"  速度 "+r.speed); await refresh(); }
});

$("#sub-add").onclick=()=>openSubEditor(null);
$("#sub-update").onclick=async()=>{ toast("正在更新全部订阅…"); const r=await api("/api/subscriptions/update","POST",{}); await refresh();
  const ok=(r.results||[]).filter(x=>!x.error).length; toast("更新完成："+ok+" 个成功"); };
$("#sub-rows").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-sact]"); if(!b)return;
  const i=+b.closest("tr").dataset.i, s=state.config.subscriptions[i], act=b.dataset.sact;
  if(act==="edit") openSubEditor(i);
  else if(act==="del"){ if(confirm("删除订阅「"+(s.name||s.url)+"」？")) await saveConfig(cfg=>cfg.subscriptions.splice(i,1)); }
  else if(act==="update"){ toast("正在更新 "+(s.name||"订阅")+"…"); await api("/api/subscriptions/update","POST",{id:s.id}); await refresh(); toast("更新完成"); }
});

$("#pol-add").onclick=()=>openPolicyEditor(null);
$("#pol-test").onclick=openPolicyTest;
$("#pol-rows").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-pact]"); if(!b)return;
  const i=+b.closest("tr").dataset.i, act=b.dataset.pact;
  if(act==="edit") openPolicyEditor(i);
  else await saveConfig(cfg=>{
    const ps=cfg.global.policies;
    if(act==="del") ps.splice(i,1);
    else if(act==="up"&&i>0){const t=ps[i-1];ps[i-1]=ps[i];ps[i]=t;}
    else if(act==="down"&&i<ps.length-1){const t=ps[i+1];ps[i+1]=ps[i];ps[i]=t;}
  });
});

$("#log-clear").onclick=async()=>{ await api("/api/logs/clear","POST",{}); await refresh(); };

// right-click context menu on server & subscription rows (GUI parity)
let menu=null;
function closeMenu(){ if(menu){menu.remove();menu=null;} }
function showMenu(x,y,items){
  closeMenu();
  menu=document.createElement("div"); menu.className="menu";
  items.forEach(it=>{ if(it.sep){const hr=document.createElement("hr");menu.appendChild(hr);return;}
    const b=document.createElement("button"); b.textContent=it.label; b.onclick=()=>{closeMenu();it.fn();}; menu.appendChild(b); });
  menu.style.left=Math.min(x,innerWidth-170)+"px"; menu.style.top=Math.min(y,innerHeight-200)+"px";
  document.body.appendChild(menu);
}
document.addEventListener("click",closeMenu);
$("#srv-rows").addEventListener("contextmenu",e=>{
  const tr=e.target.closest("tr[data-i]"); if(!tr)return; e.preventDefault();
  const i=+tr.dataset.i, s=state.config.servers[i];
  showMenu(e.clientX,e.clientY,[
    {label:"新建",fn:()=>openServerEditor(null)},
    {label:"编辑",fn:()=>openServerEditor(i)},
    {label:"复制",fn:async()=>{await saveConfig(cfg=>{const c=deep(s);c.id="";cfg.servers.push(c);});}},
    {label:"测速",fn:async()=>{const r=await api("/api/test","POST",{id:s.id});toast(r.error?("测速失败："+r.error):("延迟 "+r.latency+" 速度 "+r.speed));}},
    {sep:true},
    {label:"设为当前",fn:async()=>saveConfig(cfg=>cfg.activeId=s.id)},
    {label:"删除",fn:async()=>{if(confirm("删除 「"+displayName(s)+"」？"))await saveConfig(cfg=>cfg.servers.splice(i,1));}},
  ]);
});

async function start(){
  try { meta=await api("/api/meta"); } catch(e){ toast("无法加载元数据"); }
  initGlobal();
  await refresh();
  renderTab();
  setInterval(refresh,1000);
}
start();
</script>
